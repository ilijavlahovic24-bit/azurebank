name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: azurebankacruyt35v
  ACR_LOGIN_SERVER: azurebankacruyt35v.azurecr.io
  IMAGE_NAME: azurebank
  APP_NAME: azurebank-app-uyt35v
  APP_URL: https://azurebank-app-uyt35v.azurewebsites.net

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify ACR exists
        run: |
          echo "Checking ACR: $ACR_NAME"
          az acr show --name $ACR_NAME --query "{name:name, loginServer:loginServer, location:location}" -o table

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE_NAME:${{ github.sha }} \
            --image $IMAGE_NAME:latest \
            --file Dockerfile \
            .

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Health check
        run: |
          echo "Waiting for App Service to come up..."
          sleep 30
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" $APP_URL/health)
            if [ "$status" = "200" ]; then
              echo "✓ Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$status, retrying in 15s..."
            sleep 15
          done
          echo "✗ Health check failed after 5 attempts"
          exit 1