name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: azurebankacruyt35v
  ACR_LOGIN_SERVER: azurebankacruyt35v.azurecr.io
  IMAGE_NAME: azurebank
  APP_NAME: azurebank-app-uyt35v
  APP_URL: https://azurebank-app-uyt35v.azurewebsites.net

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 1. Prijava na ACR (Docker)
      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 2. Izgradnja slike na GitHub runneru
      - name: Build Docker image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # 3. Slanje slike u ACR
      - name: Push image to ACR
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # 4. Deploy na App Service
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 5. Provera zdravlja
      - name: Health check
        run: |
          echo "Waiting for App Service to come up..."
          sleep 30
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.APP_URL }}/health)
            if [ "$status" = "200" ]; then
              echo "✓ Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$status, retrying in 15s..."
            sleep 15
          done
          echo "✗ Health check failed after 5 attempts"
          exit 1